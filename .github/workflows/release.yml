name: release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run to package, the latest one of the branch by default."
        required: false
        type: string

permissions:
  contents: read
  # mkrelease.sh reads the artifacts of the build workflow.
  actions: read

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Package Builds
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ inputs.run_id }}
      run: ./mkrelease.sh ${RUN_ID:+-r "$RUN_ID"}
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: qsock_release
        path: ./release/*
        if-no-files-found: error
        retention-days: 30
